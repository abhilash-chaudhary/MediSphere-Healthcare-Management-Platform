server:
  port: 8094

spring:
  application:
    name: model-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/medisphere_models

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
